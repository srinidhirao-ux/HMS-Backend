spring.application.name=hospital-management-system
server.port=${SERVER_PORT:8080}

# TiDB Cloud is MySQL compatible, so we use the MySQL JDBC driver.
# Recommended local env var:
# TIDB_DATABASE_URL=jdbc:mysql://HOST:4000/hospital_db?sslMode=VERIFY_IDENTITY
spring.datasource.url=${TIDB_DATABASE_URL:jdbc:mysql://HOST:4000/hospital_db?sslMode=VERIFY_IDENTITY}
spring.datasource.username=${TIDB_USERNAME:YOUR_USERNAME}
spring.datasource.password=${TIDB_PASSWORD:YOUR_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS origins for the React frontend.
# Because this app uses session cookies, Spring cannot use allowedOrigins("*").
# allowedOriginPatterns lets Spring echo the real request origin while still allowing credentials.
#
# Local/default:
# app.cors.allowed-origin-patterns=http://localhost:5173
#
# For many Vercel domains, set this in Render:
# CORS_ALLOWED_ORIGIN_PATTERNS=https://*.vercel.app,http://localhost:5173
#
# To allow any frontend temporarily:
# CORS_ALLOWED_ORIGIN_PATTERNS=*
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173}

# Demo login credentials. Change these before deploying.
app.security.admin-username=${ADMIN_USERNAME:admin}
app.security.admin-password=${ADMIN_PASSWORD:admin123}

# Helpful for session cookies during local frontend/backend development.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.forward-headers-strategy=framework
